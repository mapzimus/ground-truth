<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Page Not Found — Lidar Site Studies</title>
<meta name="robots" content="noindex">
<link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>⛰️</text></svg>">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Archivo+Black&family=Archivo:wght@400;600;700&family=IBM+Plex+Mono:wght@400;500;700&display=swap" rel="stylesheet">
<style>
:root{
  --ground:#1a1b16; --paper:#f2efe6; --amber:#ffb400; --line:#3a3b33;
  --mono:'IBM Plex Mono',monospace; --disp:'Archivo Black',sans-serif; --body:'Archivo',sans-serif;
}
*{margin:0;padding:0;box-sizing:border-box}
body{background:var(--ground);color:var(--paper);font-family:var(--body);line-height:1.55;min-height:100vh;
  display:flex;align-items:center;
  background:
    repeating-linear-gradient(0deg,transparent 0 39px,rgba(255,180,0,.05) 39px 40px),
    repeating-linear-gradient(90deg,transparent 0 39px,rgba(255,180,0,.05) 39px 40px),
    var(--ground);}
.wrap{max-width:1080px;margin:0 auto;padding:48px 24px}
.kicker{font-family:var(--mono);font-size:13px;letter-spacing:.22em;text-transform:uppercase;color:var(--amber)}
h1{font-family:var(--disp);font-size:clamp(40px,7vw,84px);line-height:1.02;margin:18px 0 22px;text-transform:uppercase}
h1 span{color:var(--amber)}
p{max-width:56ch;font-size:19px;color:#cfcaba}
a{color:var(--amber)}
</style>
</head>
<body>
<div class="wrap">
  <div class="kicker">404 · No returns from this pulse</div>
  <h1>Nothing on the <span>ground here.</span></h1>
  <p>The page you're looking for doesn't exist — it may have moved, or the link
  is stale. Head back to <a href="/ground-truth/">the project index</a>.</p>
</div>
</body>
</html>
